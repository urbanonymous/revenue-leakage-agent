[project]
name = "revenue-leakage-agent"
version = "0.1.0"
description = "AI Revenue Leakage Detection Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pydantic-ai>=0.0.14",
    "openai>=1.3.7",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "python-dateutil>=2.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

