services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenue-agent-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend:/app
      - ./sandbox:/app/sandbox
    networks:
      - revenue-agent-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: revenue-agent-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - revenue-agent-network
    restart: unless-stopped

networks:
  revenue-agent-network:
    driver: bridge

